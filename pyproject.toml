[project]
name = "geneagent"
version = "0.1.0"
description = "Self-verification Language Agent for Gene Set Analysis using Domain Databases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "gensim>=4.3.2",
    "ipykernel>=6.30.1",
    "nltk>=3.9.1",
    "numpy>=1.26.3",
    "openai>=1.0.0",
    "pandas>=2.1.4",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "tiktoken>=0.11.0",
    "torch>=1.13.0",
    "transformers>=4.56.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.1.0"]
bedrock = ["langchain-aws>=0.1.0"]
all = [
    "langchain-anthropic>=0.1.0",
    "langchain-aws>=0.1.0",
]
