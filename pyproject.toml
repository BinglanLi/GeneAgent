readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gensim>=4.3.2",
    "ipykernel>=6.30.1",
    "nltk>=3.9.1",
    "numpy>=2.3.2",
    "openai>=1.102.0",
    "pandas>=2.3.2",
    "requests>=2.32.5",
    "requests-oauthlib>=2.0.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "tiktoken>=0.11.0",
    "torch>=2.8.0",
    "transformers>=4.56.0",
]
